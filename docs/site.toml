id = "models"
title = "EarthSciModels"
description = "Browsable catalog of .esm Earth-science model components."
repo = "EarthSciML/EarthSciModels"

# Run from the repo root before the docs-bundle action (see templates/docs.yml
# in EarthSciML/earthsci.dev); they write docs/content/components and docs/static/plots.
prebuild = [
  "julia --project=tools/plots -e 'using Pkg; Pkg.instantiate()'",
  "julia --project=tools/plots tools/render_example_plots.jl",
  "python tools/esm_to_docs.py",
]

[[nav]]
title = "Components"
path = "components/"
[[nav]]
title = "Domains"
path = "/domains/"
[[nav]]
title = "Types"
path = "/component_types/"
