# Environment for tools/render_example_plots.jl (the docs build's plot
# renderer) and its tests. Kept apart from the package's own Project.toml so
# the plotting stack never becomes a dependency of EarthSciModels.
#
# EarthSciAST.jl is tracked at `main`, like the rest of this rig; `[sources]`
# lets `Pkg.instantiate()` resolve it without a committed Manifest. For local
# work against a checkout, `Pkg.develop(path=...)` into this environment.

[deps]
EarthSciAST = "c7bf5e87-b31b-4281-bdce-ffb8a46ec87c"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
OrdinaryDiffEqBDF = "6ad6398a-0878-4a85-9266-38940aa047c8"
OrdinaryDiffEqRosenbrock = "43230ef6-c299-4910-a778-202eb28ce4ce"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
SciMLBase = "0bca4576-84f4-4d90-8ffe-ffa030f20462"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[sources]
EarthSciAST = {url = "https://github.com/EarthSciML/EarthSciAST.git", rev = "main", subdir = "pkg/EarthSciAST.jl"}

[compat]
JSON3 = "1.14"
OrdinaryDiffEqBDF = "2.4"
OrdinaryDiffEqRosenbrock = "2.7"
Plots = "1.41"
SciMLBase = "3.58"
julia = "1.12"
