name = "EarthSciModels"
uuid = "5d2e8f41-1a7c-4b3d-9c8e-2f4a6b8d0e12"
version = "0.1.0"
authors = ["EarthSciML Authors and Contributors"]

[deps]
EarthSciAST = "c7bf5e87-b31b-4281-bdce-ffb8a46ec87c"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
ModelingToolkit = "961ee093-0014-501f-94e3-6117800e7a78"
OrdinaryDiffEqTsit5 = "b1df2697-797e-41e3-8120-5422d3b24e4a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
WildlandFire = "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

[compat]
# Tracks the version EarthSciAST.jl actually declares on `main`
# (pkg/EarthSciAST.jl/Project.toml, currently 0.5.0). It read "0.5" — the
# EarthSciAST *repo*'s version line, not the Julia package's — which made the
# environment unresolvable: `Pkg.add(url=...; rev="main")`, the path
# scripts/setup_polecat_env.sh takes and the only way to get the version this
# rig needs, failed with "empty intersection between EarthSciAST@0.2.0 and
# project compatibility 0.5". Bump this when the Julia package's own `version`
# moves, not when the repo's does. It last read "0.3" (after the 0.3.0 release
# turned every Julia shard red at the resolve step with the same error), and
# 0.5.0 followed on main.
EarthSciAST = "0.5"
JSON3 = "1.14.3"
ModelingToolkit = "11.25.0"
OrdinaryDiffEqTsit5 = "1.12.0"
julia = "1.12"
