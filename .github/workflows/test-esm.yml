name: test-esm

on:
  push:
    branches: [main]
  pull_request:

# Coalesce concurrent runs on the same ref. On PR branches the latest push
# supersedes earlier in-flight runs (the usual GHA pattern). On main we let
# runs queue but each runs to completion — `cancel-in-progress: false` —
# because every main commit is a merge that should be independently verified
# (esm-g97l).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Python inline-test gate (mdl-w1j, promoted to required in mdl-lvu,
  # extended to all live-repo coverage in esm-g97l, made the sole CI gate
  # in esm-m0r2 — the Julia walker was removed because in-process MTK
  # builds do not scale to the live migration burst and were blowing job
  # timeouts even with ESM_TESTS_SKIP_LIVE_REPO).
  #
  # It is no longer the only sweep: `julia-inline-tests` (the rig's own MTK
  # walker, sharded across a matrix) and `rust-cli-inline-tests` (the `esm test`
  # CLI) sweep the same corpus through the other two canonical ESS runners. All
  # three walk every file and all three block — where a binding cannot yet run
  # what another already does, that is reported as a failing job, not filtered
  # out. This one is still the runner with per-file OOM isolation, and the one
  # the corpus was migrated against.
  #
  # Walks components/**/*.esm and lib/**/*.esm (mdl-14s) and runs every inline
  # test through the canonical ESS Python runner
  # (earthsci_ast.esm_problem + solve, cse=False). lib/*.esm files without
  # inline tests still get a load-only minimum-bar gate so structural drift
  # (e.g. mdl-pk3, mdl-97r in lib/solar.esm) is caught at PR time. One
  # subprocess per file (Python's per-process GC is the OOM guardrail; cf.
  # bead mdl-w1j scope and the esm-9ms phase-wise RSS diagnostic showing peak
  # 196 MB across geoschem_fullchem). 25-min hard cap stays under CI's 30-min
  # job timeout.
  #
  # This is the **gate of record** for live-repo inline tests. The 819-reaction
  # geoschem_fullchem.esm Catalyst → MTK build OOM-kills the 16 GB GHA runner
  # in-process, but this gate exercises it safely via per-file subprocess
  # (peak ~196 MB) — the in-process Julia walk below has no such isolation and
  # is not expected to survive that file. Local devs still get full Julia
  # coverage via `pkg test` — see docs/migration-guide.md (mdl-cac).
  python-inline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install the canonical Python runner from EarthSciAST main.
      # The package isn't on PyPI yet (matching the unregistered Julia state
      # handled by setup_polecat_env.sh).
      - name: Install earthsci_ast (from EarthSciAST main)
        run: |
          python -m pip install --upgrade pip
          # phase-6 H-4: SciPy is NOT a base dependency of earthsci-ast (a
          # library must not embed a solver; esm-libraries-spec §2.4/§2.5.9).
          # This gate integrates every inline test, so it asks for the
          # `simulate` extra by name rather than getting the solver by accident.
          python -m pip install \
            "earthsci_ast[simulate] @ git+https://github.com/EarthSciML/EarthSciAST.git@main#subdirectory=pkg/earthsci-ast-py"
      # Discretization library for PDE components: a discretization-agnostic PDE
      # leaf (e.g. surface_runoff/saint_venant.esm) injects a discretization at
      # test time whose adapter imports an EarthSciDiscretizations stencil via a
      # ${ESD_ROOT} ref (esm-spec §4.7 env-var expansion). Clone it and point the
      # env var at it so those refs resolve.
      - name: Clone EarthSciDiscretizations (discretization library)
        run: |
          git clone --depth=1 https://github.com/EarthSciML/earthscidiscretizations.git /tmp/esd
          echo "ESD_ROOT=/tmp/esd" >> "$GITHUB_ENV"
      - name: Run Python inline-test gate (cse=False, per-file subprocess)
        run: |
          python tools/run_esm_inline_tests.py --junit-xml python-esm-tests.xml
      - name: Upload junit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-esm-inline-tests-junit
          path: python-esm-tests.xml
          if-no-files-found: ignore

  # Julia inline-test sweep (the rig's own runner, back in CI).
  #
  # `EarthSciModels.run_esm_tests` is the canonical Julia walker (AGENTS.md §1):
  # it loads each `.esm` through `EarthSciAST.load_path`, builds a
  # `ModelingToolkit.System` (or a Catalyst `ReactionSystem`), integrates each
  # §6.6 test and samples the interpolant. It is the runner this repo's own
  # `src/` shim is written against, and it was the last one still missing from
  # CI: `esm-g97l` set ESM_TESTS_SKIP_LIVE_REPO=1 on the Julia job and `esm-m0r2`
  # removed the job outright, because the walk builds every system IN-PROCESS at
  # roughly a minute-plus per file and a single job could not hold the corpus
  # inside the 30-minute budget.
  #
  # That was a budget problem, not a coverage one, and a budget problem has a
  # budget fix: `ESM_TESTS_SHARD="i/n"` (see `shard_esm_files` in
  # src/run_tests.jl) strides the sorted corpus so each shard gets an interleaved
  # slice of every science domain rather than a contiguous block of one. The
  # shards together are a partition — every committed `.esm` is walked by exactly
  # one of them — so the sweep is whole again, just spread across n runners.
  #
  # Each shard also runs the shim unit tests and the fixture-based exercise of
  # the runner (that part is seconds, and was already in CI before esm-m0r2).
  #
  # Every `.esm` is walked — ESM_TESTS_EXCLUDE is deliberately not set. That
  # includes geoschem_fullchem.esm, whose 819-reaction Catalyst → MTK build the
  # in-process walker is not expected to survive on a 16 GB runner (the Python
  # gate carries it in a subprocess at ~196 MB peak). Its shard failing is the
  # honest report of where the Julia path stands; excluding the file would only
  # move that fact out of CI and into a comment.
  #
  # `fail-fast: false`: a failure in one shard says nothing about the others, and
  # a partial matrix hides which domains are actually broken.
  julia-inline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Keep in step with the `shard:` list above.
      ESM_TESTS_SHARD: ${{ matrix.shard }}/8
      # Absolute: `Pkg.test()` runs the suite in a subprocess whose working
      # directory is not guaranteed to be the workspace root.
      ESM_TESTS_JUNIT_XML: ${{ github.workspace }}/julia-esm-tests-${{ matrix.shard }}.xml
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          # The version this rig's [compat] pins.
          version: '1.12'

      # `include-matrix: false` gives every shard ONE shared cache key. The
      # depot content is identical across shards (same Manifest, same
      # precompiled MTK/Catalyst), and a per-shard key would mean paying the
      # ~20-minute cold MTK precompile eight times over on every cache miss
      # instead of once.
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-inline-tests
          include-matrix: false

      # EarthSciAST.jl is registered in General only at 0.2.0's registry entry
      # and this rig tracks `main`, so the environment is resolved the way
      # docs/ and local development do it — through the repo's own setup script,
      # which Pkg.add's the package from GitHub and instantiates.
      - name: Resolve EarthSciAST.jl into the project environment
        run: scripts/setup_polecat_env.sh

      # Same discretization library the Python gate clones: a
      # discretization-agnostic PDE leaf pulls an EarthSciDiscretizations
      # stencil in over a `${ESD_ROOT}` ref (esm-spec §4.7).
      - name: Clone EarthSciDiscretizations (discretization library)
        run: |
          git clone --depth=1 https://github.com/EarthSciML/earthscidiscretizations.git /tmp/esd
          echo "ESD_ROOT=/tmp/esd" >> "$GITHUB_ENV"

      # The walk runs INSIDE `Pkg.test()` rather than as a second
      # `julia --project=.` call, because ModelingToolkit / Catalyst /
      # OrdinaryDiffEq are test-target deps and are not visible outside the test
      # environment. `ESM_TESTS_SHARD` selects this shard's slice; the junit
      # report is written in the same pass.
      - name: Julia inline-test sweep (shard ${{ matrix.shard }} of 8)
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Upload junit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-esm-inline-tests-junit-${{ matrix.shard }}
          path: julia-esm-tests-${{ matrix.shard }}.xml
          if-no-files-found: ignore

  # Rust CLI inline-test sweep.
  #
  # Runs the same `.esm` corpus as `python-inline-tests` through the canonical
  # **Rust** ESS runner — `esm test`, the CLI binary of the `earthsci-ast` crate
  # (AGENTS.md §1). The point is not redundant coverage of the models: the
  # Python gate already owns that. The point is that op semantics, tolerance
  # resolution (§6.6.4) and the flatten/classify pipeline are single-sourced
  # ACROSS bindings, and nothing in this rig noticed when two bindings answered
  # a `(variable, time, expected)` assertion differently, because only one
  # binding ever ran here.
  #
  # The CLI is built from EarthSciAST `main`, the same revision the Python gate
  # pip-installs, so the two jobs compare like with like. `esm` is not published
  # to crates.io and the repo cuts no binary releases, so building it is the only
  # way to get it; ~8 min from cold, and Swatinem/rust-cache keeps the dependency
  # tree (diffsol, s2rst, ndarray, jsonschema) out of every later run.
  #
  # The sweep covers every `.esm` under components/, lib/ and
  # registered_functions/, and the job fails on any non-pass row. There is no
  # allowlist and no deferred set: where the Rust binding does not yet reach what
  # the Python gate already runs, that shows up here as a red job rather than as
  # a quiet line in a skip file. As measured when this job landed, that is a real
  # and substantial gap — 96 of 322 files with inline tests carry at least one
  # non-pass row (diffsol failing the very first step, algebraic unknowns with no
  # D(x,t) equation, unexpanded §4.7 `${VAR}` refs, a few numeric divergences) —
  # and closing it is upstream work on EarthSciAST, not corpus work here.
  rust-cli-inline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `/_EarthSciAST/` is this repo's conventional (and .gitignore'd) spot for
      # a sibling EarthSciAST checkout, so the clone sits inside the workspace
      # where Swatinem/rust-cache resolves its `workspaces` paths.
      ESS_RS: _EarthSciAST/pkg/earthsci-ast-rs
    steps:
      - uses: actions/checkout@v4

      # Cloned before the toolchain/cache steps: Swatinem/rust-cache keys on the
      # Cargo.lock it finds in `workspaces`, so the checkout has to exist first.
      - name: Clone EarthSciAST (Rust runner source, from main)
        run: git clone --depth=1 https://github.com/EarthSciML/EarthSciAST.git _EarthSciAST

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ESS_RS }}

      # `--locked`: build the dependency versions EarthSciAST committed, so a
      # fresh minor release of a transitive dep cannot turn this job red with no
      # commit behind it (the reason ESS pins its own linters).
      - name: Build the canonical `esm` CLI
        run: |
          cargo build --release --locked --bin esm \
            --manifest-path "$ESS_RS/Cargo.toml"
          "$ESS_RS/target/release/esm" --version

      # Same discretization library the Python gate clones, for the same reason:
      # a discretization-agnostic PDE leaf injects an adapter whose stencil comes
      # in over a `${ESD_ROOT}` ref (esm-spec §4.7). The Rust loader does not
      # expand `${VAR}` in a ref yet — which is exactly the kind of divergence
      # this job exists to surface — so wiring it here means the fix, when it
      # lands upstream, needs no change on this side.
      - name: Clone EarthSciDiscretizations (discretization library)
        run: |
          git clone --depth=1 https://github.com/EarthSciML/earthscidiscretizations.git /tmp/esd
          echo "ESD_ROOT=/tmp/esd" >> "$GITHUB_ENV"

      - name: Rust inline-test sweep
        run: |
          set -eo pipefail
          "$ESS_RS/target/release/esm" test components lib registered_functions \
            | tee /tmp/rust-sweep.log

      - name: Upload Rust sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-esm-inline-tests-log
          path: /tmp/rust-sweep.log
          if-no-files-found: ignore

  # Consumer end-to-end gate (esm-3nc.6 fixture; wired into CI by esm-aha).
  # Runs test/e2e_consumer_regrid_check.py, which validates the pure-IO
  # data-loader migration (RFC pure-io-data-loaders §6/§7) from a *consumer's*
  # vantage point: a downstream model that {"ref"}-includes the migrated
  # single-component OpenAQ model resolves through the canonical ESS runner
  # (a two-level pure-IO loader ref chain consumer → openaq.esm →
  # openaq_loader.esm), carries a valid per-variable `regrid` block, and
  # exposes fields whose interface + regrid-fill intent are identical (to
  # tolerance) to the frozen pre-migration reference.
  #
  # Separate job from python-inline-tests on purpose: the e2e fixtures live
  # under test/fixtures/** — deliberately outside components/** and lib/**, so
  # neither the Python inline-test walk nor the Julia discovery auto-walks them
  # (see test/fixtures/earthsci_data/README.md). The inline gate therefore
  # never exercised this consumer pathway. Before esm-aha the script existed
  # but was wired into no CI job, leaving the consumer ref-include chain
  # unguarded; this job closes that gap. An independent job also keeps the
  # consumer signal visible regardless of the inline gate's result.
  #
  # Scope note (numeric validation deferred): this check asserts the
  # *interface + regrid intent* identity the model-content rig owns (exposed
  # variable names/types/units and the regrid kernel + fill semantics, the
  # last compared numerically to tolerance). Numeric regridded *field values*
  # (station concentrations) require external OpenAQ data and are a downstream
  # consumer-repo concern (AGENTS.md §2); they are not assertable in-repo
  # against the frozen interface-only reference, so they are deferred
  # downstream rather than checked here — see the script docstring and the
  # fixtures README "Why structural (not numeric) field identity" section.
  consumer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Same canonical ESS Python runner the inline-test gate installs
      # (earthsci_ast from EarthSciAST main; not yet on PyPI).
      - name: Install earthsci_ast (from EarthSciAST main)
        run: |
          python -m pip install --upgrade pip
          # This job only `load_path()`s: no solver, so the BASE install is
          # deliberately enough (phase-6 H-4 — scipy/xarray are extras).
          python -m pip install \
            "earthsci_ast @ git+https://github.com/EarthSciML/EarthSciAST.git@main#subdirectory=pkg/earthsci-ast-py"
      - name: Run consumer ref-include + regrid-intent e2e (esm-3nc.6)
        run: |
          python test/e2e_consumer_regrid_check.py
