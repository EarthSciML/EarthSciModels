name: docs

# Component pages and example plots are generated from components/**/*.esm
# before the bundle is built (prebuild steps below). The site itself (Hugo,
# search, link check, deploy) is built by earthsci.dev. The old standalone
# workflow set no job timeout (GitHub's 360 min default) and the plot
# rendering is slow, so the bundle job gets a generous one.

# Installed in each EarthSci source repo as .github/workflows/docs.yml.
# Nothing of the docs machinery lives in this repo: extraction, rendering and
# bundling all run from EarthSciML/earthsci.dev (DESIGN.md there).
#
# On push to main: extract API docs, build the docs bundle, merge it into this
# repo's `docs-bundle` branch as the `dev` version and notify earthsci.dev,
# which rebuilds the site.
# On a push of a release tag vX.Y.Z: the same, from the code at that tag (every
# prebuild step runs), published as that version of the whole docs. The site
# then offers it in the version selector.
# On pull requests: the same, minus publishing and notifying (validation only).
#
# Needs the repo (or org) secrets DOCS_APP_ID and DOCS_APP_PRIVATE_KEY: a GitHub
# App installed on EarthSciML/earthsci.dev with contents:write, used to notify
# the site (repository_dispatch).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Publishing merges into one shared branch; tools/publish.py retries on a
# conflict, but a tag build should still never be cancelled by a later push.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bindings: ${{ steps.plan.outputs.bindings }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EarthSciML/earthsci.dev
          ref: main
          path: .earthsci-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Prints the bindings in docs/api/config.toml as a JSON array ([] when
      # the repo has no API reference).
      - id: plan
        run: echo "bindings=$(python .earthsci-dev/tools/api_docs/plan.py --repo-root .)" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    if: needs.plan.outputs.bindings != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A failing binding is reported but does not block the bundle; it renders
    # as "not extracted in this build". Remove to make failures fatal.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(needs.plan.outputs.bindings) }}
    steps:
      - uses: actions/checkout@v4
      - uses: EarthSciML/earthsci.dev/.github/actions/api-extract@main
        with:
          binding: ${{ matrix.binding }}

  bundle:
    needs: [plan, extract]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # push the docs-bundle branch
    steps:
      - uses: actions/checkout@v4

      # Prebuild (docs/site.toml `prebuild`): component pages and example plots
      # are generated from components/**/*.esm, never committed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python plotting deps
        run: |
          python -m pip install --upgrade matplotlib numpy scipy sympy
          # `earthsci_ast` is a HARD dependency of both generators, not just of
          # the plotting one: from esm 1.0.0 the only declared variable types
          # are `unknown` and `parameter`, and `tools/esm_to_docs.py` asks
          # `earthsci_ast.classification` (esm-spec §6.3.1) which unknowns are
          # ODE states, observed or algebraic rather than reading a declared
          # type. Install it before the unit-test step below.
          #
          # Clone the toolkit source so we can both pip-install it and copy its
          # bundled schema into the installed package (belt-and-braces; without
          # the schema `load()` raises "ESM schema not found").
          git clone --depth=1 https://github.com/EarthSciML/EarthSciAST.git "$RUNNER_TEMP/ess"
          python -m pip install "$RUNNER_TEMP/ess/pkg/earthsci-ast-py"
          INSTALLED_DIR=$(python -c 'import earthsci_ast, os; print(os.path.dirname(earthsci_ast.__file__))')
          mkdir -p "$INSTALLED_DIR/data"
          cp "$RUNNER_TEMP/ess/pkg/earthsci-ast-py/src/earthsci_ast/data/esm-schema.json" "$INSTALLED_DIR/data/"

      - name: Unit test the generators
        run: |
          python -m unittest tools/esm_to_docs_test.py
          python -m unittest tools/render_example_plots_test.py

      - name: Render example plots from .esm
        run: python tools/render_example_plots.py

      - name: Generate component pages from .esm
        run: python tools/esm_to_docs.py

      - name: Download extracted docstrings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: api-docs-*
          path: build/api-docs
          merge-multiple: true

      # Short-lived token for notifying earthsci.dev; not minted on pull requests,
      # which only validate.
      - name: Create site dispatch token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: EarthSciML
          repositories: earthsci.dev

      - uses: EarthSciML/earthsci.dev/.github/actions/docs-bundle@main
        with:
          dispatch-token: ${{ steps.app-token.outputs.token }}
